<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡單待辦清單</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .todo-container {
            margin-top: 50px;
            max-width: 500px;
        }
        /* 完成項目刪除線 */
        .completed {
            text-decoration: line-through;
            color: #6c757d;
        }
    </style>

</head>
<body class="bg-light">

    <div class="container todo-container">
        <h3 class="text-center mb-4">待辦清單</h3>

        <!-- 輸入區 -->
        <div class="input-group mb-3">
            <input type="text" id="todoInput" class="form-control" placeholder="新增事項...">
            <button class="btn btn-primary" type="button" onclick="addTodo()">新增</button>
        </div>

        <!-- 顯示區 -->
        <ul id="todoList" class="list-group">
            <!-- 項目 -->
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div class="form-check m-0">
                    <input class="form-check-input me-2" type="checkbox" onclick="toggleComplete(this)">
                    <span>項目1</span>
                </div>
                <button class="btn btn-danger btn-sm" onclick="deleteTodo(this)">刪除</button>
            </li>
        </ul>
    </div>

       <!-- 功能 -->
    <script>
        // 新增項目
        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            if (text === '') return; 
            // 沒打字不執行

            const list = document.getElementById('todoList');
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `
                <div class="form-check m-0">
                    <input class="form-check-input me-2" type="checkbox" onclick="toggleComplete(this)">
                    <span>${text}</span>
                </div>
                <button class="btn btn-danger btn-sm" onclick="deleteTodo(this)">刪除</button>
            `;
            list.appendChild(li);
            input.value = ''; 
            // 清空輸入框
        }

        // 刪除
        function deleteTodo(button) {
            button.closest('li').remove();
        }

        // 勾選完成
        function toggleComplete(checkbox) {
            const textSpan = checkbox.nextElementSibling; // 抓到旁邊的文字標籤
            if (checkbox.checked) {
                textSpan.classList.add('completed');
            } else {
                textSpan.classList.remove('completed');
            }
        }
    </script>
</body>
</html>
